name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Derive the release version from the tag and write it into every file
      # the build cares about. The tag is the source of truth; package.json,
      # tauri.conf.json, and Cargo.toml only need to agree at build time.
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          # Replace the FIRST `version = "..."` line in Cargo.toml — that's the
          # [package] one. awk is portable across linux/macos/git-bash.
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-4-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pex v__VERSION__'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # After every build target succeeds, commit the bumped version back to
  # master so the source tree stays honest about what was released. Runs once
  # (not in the matrix) on ubuntu.
  sync-version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # We need the default token to be able to push back. If branch
          # protection blocks bot pushes, this step will fail loudly — fix
          # by allowing github-actions[bot] to bypass, or by replacing
          # GITHUB_TOKEN with a PAT in `token:`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version bump to master
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; then
            echo "Master is already at ${GITHUB_REF_NAME#v}; nothing to commit."
            exit 0
          fi
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          # [skip ci] prevents re-triggering workflows on the bump commit.
          git commit -m "chore: sync version to ${GITHUB_REF_NAME#v} [skip ci]"
          git push origin master
