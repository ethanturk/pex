name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # Derive the release version from the tag. `npm version` writes
      # package.json, and tauri.conf.json reads its version from there via
      # "version": "../package.json" — so the desktop bundle and the iOS/Android
      # versions all follow automatically (no need to rewrite tauri.conf.json).
      # Cargo.toml's [package] version is bumped too to keep crate metadata in step.
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          # Replace the FIRST `version = "..."` line in Cargo.toml — that's the
          # [package] one. awk is portable across linux/macos/git-bash.
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-4-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization (macOS only — vars are
          # unused on other runners). tauri-action imports APPLE_CERTIFICATE
          # into a temporary keychain, signs with APPLE_SIGNING_IDENTITY,
          # then submits to Apple's notary service using APPLE_ID +
          # APPLE_PASSWORD (app-specific password) + APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pex v__VERSION__'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # Android: build a signed universal APK and ship it to Firebase App
  # Distribution. Runs in parallel with the desktop `build` job (does not block
  # `sync-version`, so a desktop release still completes if Android secrets are
  # not configured yet).
  #
  # Required repository secrets:
  #   ANDROID_KEYSTORE_BASE64    - base64 of the release keystore (.jks/.keystore)
  #   ANDROID_KEYSTORE_PASSWORD  - keystore (store) password
  #   ANDROID_KEY_ALIAS          - signing key alias
  #   ANDROID_KEY_PASSWORD       - signing key password
  #   FIREBASE_ANDROID_APP_ID    - Firebase Android app id (e.g. 1:123:android:abcd)
  #   FIREBASE_SERVICE_ACCOUNT   - Firebase service-account JSON (App Distribution Admin)
  # Optional variable:
  #   FIREBASE_TESTER_GROUPS     - comma-separated tester groups (default: testers)
  android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # package.json is the single version source; tauri.conf.json reads it
          # via "../package.json", so versionName/versionCode follow.
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (platform, build-tools, NDK)
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d \
            ! -path "$NDK_PATH" -exec rm -rf {} +
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Validate Android distribution secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          count_present() {
            present=0
            for name in "$@"; do
              if [ -n "${!name:-}" ]; then
                present=$((present + 1))
              fi
            done
            echo "$present"
          }

          signing_present="$(count_present \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD)"
          firebase_present="$(count_present \
            FIREBASE_ANDROID_APP_ID \
            FIREBASE_SERVICE_ACCOUNT)"

          if [ "$signing_present" -eq 4 ]; then
            echo "ANDROID_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          elif [ "$signing_present" -eq 0 ]; then
            echo "ANDROID_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Android signing secrets are not configured; building an unsigned APK and skipping distribution."
          else
            echo "::error::Android signing secrets are partially configured. Set all of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

          if [ "$firebase_present" -eq 2 ]; then
            echo "ANDROID_FIREBASE_CONFIGURED=true" >> "$GITHUB_ENV"
          elif [ "$firebase_present" -eq 0 ]; then
            echo "ANDROID_FIREBASE_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Firebase App Distribution secrets are not configured; upload will be skipped."
          else
            echo "::error::Firebase App Distribution secrets are partially configured. Set both FIREBASE_ANDROID_APP_ID and FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Apply Android customizations (icons, manifest, signing config)
        run: npm run android:setup

      - name: Configure release signing
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GEN="$GITHUB_WORKSPACE/src-tauri/gen/android"
          KEYSTORE="$GEN/release.jks"
          KEYSTORE_ERR="$RUNNER_TEMP/android-keystore.err"
          VALIDATION_DIR="$RUNNER_TEMP/android-signing-validation"
          VALIDATION_JAR="$RUNNER_TEMP/android-signing-validation.jar"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Recreate it from the binary keystore file, for example: base64 -w0 release.jks"
            exit 1
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore file."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null 2> "$KEYSTORE_ERR"; then
            echo "::error::Android release keystore validation failed. Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
            sed 's/^/keytool: /' "$KEYSTORE_ERR" >&2
            exit 1
          fi

          rm -rf "$VALIDATION_DIR" "$VALIDATION_JAR"
          mkdir -p "$VALIDATION_DIR"
          printf 'pex android signing validation\n' > "$VALIDATION_DIR/marker.txt"
          jar cf "$VALIDATION_JAR" -C "$VALIDATION_DIR" marker.txt
          if ! jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$VALIDATION_JAR" \
            "$ANDROID_KEY_ALIAS" > /dev/null 2> "$KEYSTORE_ERR"; then
            echo "::error::Android release key validation failed. Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            sed 's/^/jarsigner: /' "$KEYSTORE_ERR" >&2
            exit 1
          fi

          # storeFile is absolute so gradle's file() resolves it regardless of
          # the module it is evaluated from.
          {
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$GEN/keystore.properties"

      - name: Build APK
        run: npx tauri android build --apk --verbose

      - name: Upload to Firebase App Distribution
        if: env.ANDROID_SIGNING_CONFIGURED == 'true' && env.ANDROID_FIREBASE_CONFIGURED == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          releaseNotes: 'Pex ${{ github.ref_name }}'
          file: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

  # After every build target succeeds, commit the bumped version back to
  # master so the source tree stays honest about what was released. Runs once
  # (not in the matrix) on ubuntu.
  sync-version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          # We need the default token to be able to push back. If branch
          # protection blocks bot pushes, this step will fail loudly — fix
          # by allowing github-actions[bot] to bypass, or by replacing
          # GITHUB_TOKEN with a PAT in `token:`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version bump to master
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml
          if [ -f src-tauri/gen/apple/project.yml ]; then
            awk -v v="$VERSION" '
              /^        CFBundleShortVersionString:/ { print "        CFBundleShortVersionString: " v; next }
              { print }
            ' src-tauri/gen/apple/project.yml > src-tauri/gen/apple/project.yml.tmp
            mv src-tauri/gen/apple/project.yml.tmp src-tauri/gen/apple/project.yml
          fi
          if [ -f src-tauri/gen/apple/pex_iOS/Info.plist ]; then
            awk -v v="$VERSION" '
              /<key>CFBundleShortVersionString<\/key>/ {
                print
                getline
                print "\t<string>" v "</string>"
                next
              }
              { print }
            ' src-tauri/gen/apple/pex_iOS/Info.plist > src-tauri/gen/apple/pex_iOS/Info.plist.tmp
            mv src-tauri/gen/apple/pex_iOS/Info.plist.tmp src-tauri/gen/apple/pex_iOS/Info.plist
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/gen/apple/project.yml src-tauri/gen/apple/pex_iOS/Info.plist; then
            echo "Master is already at ${GITHUB_REF_NAME#v}; nothing to commit."
            exit 0
          fi
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/gen/apple/project.yml src-tauri/gen/apple/pex_iOS/Info.plist
          # [skip ci] prevents re-triggering workflows on the bump commit.
          git commit -m "chore: sync version to ${GITHUB_REF_NAME#v} [skip ci]"
          git push origin master
