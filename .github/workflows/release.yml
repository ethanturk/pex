name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # Derive the release version from the tag. `npm version` writes
      # package.json, and tauri.conf.json reads its version from there via
      # "version": "../package.json" — so the desktop bundle and the iOS/Android
      # versions all follow automatically (no need to rewrite tauri.conf.json).
      # Cargo.toml's [package] version is bumped too to keep crate metadata in step.
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          # Replace the FIRST `version = "..."` line in Cargo.toml — that's the
          # [package] one. awk is portable across linux/macos/git-bash.
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-4-dev \
            libsoup-3.0-dev libappindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization (macOS only — vars are
          # unused on other runners). tauri-action imports APPLE_CERTIFICATE
          # into a temporary keychain, signs with APPLE_SIGNING_IDENTITY,
          # then submits to Apple's notary service using APPLE_ID +
          # APPLE_PASSWORD (app-specific password) + APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pex v__VERSION__'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # Android: build a signed universal APK and ship it to Firebase App
  # Distribution. Runs in parallel with the desktop `build` job (does not block
  # `sync-version`, so a desktop release still completes if Android secrets are
  # not configured yet).
  #
  # Required repository secrets:
  #   ANDROID_KEYSTORE_BASE64    - base64 of the release keystore (.jks/.keystore)
  #   ANDROID_KEYSTORE_PASSWORD  - keystore (store) password
  #   ANDROID_KEY_ALIAS          - signing key alias
  #   ANDROID_KEY_PASSWORD       - signing key password
  #   FIREBASE_ANDROID_APP_ID    - Firebase Android app id (e.g. 1:123:android:abcd)
  #   FIREBASE_SERVICE_ACCOUNT   - Firebase service-account JSON (App Distribution Admin)
  # Optional variable:
  #   FIREBASE_TESTER_GROUPS     - comma-separated tester groups (default: testers)
  android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # package.json is the single version source; tauri.conf.json reads it
          # via "../package.json", so versionName/versionCode follow.
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (platform, build-tools, NDK)
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Apply Android customizations (icons, manifest, signing config)
        run: npm run android:setup

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GEN="$GITHUB_WORKSPACE/src-tauri/gen/android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GEN/release.jks"
          # storeFile is absolute so gradle's file() resolves it regardless of
          # the module it is evaluated from.
          cat > "$GEN/keystore.properties" <<EOF
          storeFile=$GEN/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed APK
        run: npx tauri android build --apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          releaseNotes: 'Pex ${{ github.ref_name }}'
          file: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

  # After every build target succeeds, commit the bumped version back to
  # master so the source tree stays honest about what was released. Runs once
  # (not in the matrix) on ubuntu.
  sync-version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          # We need the default token to be able to push back. If branch
          # protection blocks bot pushes, this step will fail loudly — fix
          # by allowing github-actions[bot] to bypass, or by replacing
          # GITHUB_TOKEN with a PAT in `token:`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version bump to master
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          awk -v v="$VERSION" '
            BEGIN { done = 0 }
            /^version = "[^"]*"/ && !done { sub(/"[^"]*"/, "\"" v "\""); done = 1 }
            { print }
          ' src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json src-tauri/Cargo.toml; then
            echo "Master is already at ${GITHUB_REF_NAME#v}; nothing to commit."
            exit 0
          fi
          git add package.json package-lock.json src-tauri/Cargo.toml
          # [skip ci] prevents re-triggering workflows on the bump commit.
          git commit -m "chore: sync version to ${GITHUB_REF_NAME#v} [skip ci]"
          git push origin master
