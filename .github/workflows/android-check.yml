# Lightweight Android cross-compile check.
#
# Verifies that the Rust library — including native C dependencies such as the
# tree-sitter grammars used by the deterministic review checks — cross-compiles
# under the Android NDK. Deliberately does NOT build the APK, sign, or publish:
# no gradle, no keystore/Firebase secrets, so it can run on any branch.
name: android-check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/alibaba-pex-deterministic-checks-XSgyD

jobs:
  cross-compile:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile library for Android (arm64)
        working-directory: src-tauri
        run: cargo ndk -t arm64-v8a build --lib --release
